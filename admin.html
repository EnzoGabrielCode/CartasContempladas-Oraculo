<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin | Cartas Contempladas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="avisoDemo" class="aviso-demo" hidden>Modo demonstração — senha: <b>demo</b></div>
  <header class="topo">
    <div class="wrap">
      <div class="esq">
        <a class="btn btn-entrar" href="index.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Voltar ao site
        </a>
        <div class="marca">Oráculo <span>Admin</span></div>
      </div>
      <button class="btn btn-dourado" id="sair" hidden>Sair</button>
    </div>
  </header>

  <!-- LOGIN -->
  <section id="telaLogin" class="login caixa" hidden>
    <h2>Entrar</h2>
    <form id="formLogin">
      <label for="email">E-mail</label>
      <input class="campo" id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input class="campo" id="senha" type="password" autocomplete="current-password" required>
      <div class="erro" id="erroLogin"></div>
      <button class="btn btn-azul" style="width:100%;justify-content:center;padding:12px;margin-top:6px">Entrar</button>
    </form>
  </section>

  <!-- PAINEL -->
  <main id="telaPainel" class="wrap" style="padding:20px 16px" hidden>
    <div class="caixa">
      <div class="abas-admin" id="abasAdmin">
        <button data-aba="cartas" class="ativo">Cartas</button>
        <button data-aba="adms">Administradoras</button>
      </div>

      <section id="abaCartas">
      <div class="filtros">
        <input id="busca" class="cresce" type="search" placeholder="Buscar código ou administradora">
        <select id="fStatus">
          <option value="">Todos status</option>
          <option value="disponivel">Disponível</option>
          <option value="reservada">Reservada</option>
          <option value="vendida">Vendida</option>
        </select>
        <button class="btn btn-azul" id="nova">+ Nova carta</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr><th>Cód.</th><th>Cat.</th><th class="num">Crédito</th><th class="num">Entrada</th><th class="num">Parcelas</th><th>Administradora</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="vazio" id="vazio" hidden>Nenhuma carta cadastrada.</div>
      </section>

      <section id="abaAdms" hidden>
        <form class="form-adm" id="formAdm">
          <input type="hidden" name="id">
          <div><label>Nome da administradora</label><input class="campo" name="nome" required placeholder="Ex.: CNP Embracon"></div>
          <div><label>Logo (PNG, JPG, WEBP ou SVG)</label><input class="campo" name="logo" type="file" accept="image/*"></div>
          <div class="preview-logo" id="previewLogo">sem logo</div>
          <button class="btn btn-azul" id="btnSalvarAdm" style="padding:11px 16px">Adicionar</button>
          <button type="button" class="btn btn-claro" id="cancelarAdm" style="padding:11px 16px" hidden>Cancelar</button>
        </form>
        <div class="erro" id="erroAdm"></div>
        <div class="grade-adms" id="gradeAdms"></div>
      </section>
    </div>
  </main>

  <!-- FORMULÁRIO -->
  <dialog id="dlg">
    <form id="formCarta" method="dialog">
      <h3 id="dlgTitulo">Nova carta</h3>
      <input type="hidden" name="id">
      <div class="grade">
        <div><label>Código</label><input class="campo" name="codigo" required></div>
        <div><label>Cota</label><input class="campo" name="cota"></div>
        <div><label>Categoria</label>
          <select class="campo" name="categoria" required>
            <option value="imovel">Imóvel</option><option value="veiculo">Veículo</option>
          </select></div>
        <div><label>Status</label>
          <select class="campo" name="status">
            <option value="disponivel">Disponível</option><option value="reservada">Reservada</option><option value="vendida">Vendida (some do site)</option>
          </select></div>
        <div><label>Crédito (R$)</label><input class="campo" name="credito" inputmode="decimal" required></div>
        <div><label>Entrada (R$)</label><input class="campo" name="entrada" inputmode="decimal" required></div>
        <div><label>Nº de parcelas</label><input class="campo" name="parcelas" type="number" min="0" required></div>
        <div><label>Valor da parcela (R$)</label><input class="campo" name="valor_parcela" inputmode="decimal" required></div>
        <div><label>Saldo devedor (R$)</label><input class="campo" name="saldo_devedor" inputmode="decimal" placeholder="Em branco = parcelas × valor"></div>
        <div style="grid-column:1/-1"><label>Administradora</label>
          <div class="seletor-adm">
            <select class="campo" name="administradora" id="selAdm" required></select>
            <span id="selAdmLogo"></span>
          </div>
        </div>
        <div><label>Grupo</label><input class="campo" name="grupo"></div>
      </div>
      <div class="erro" id="erroForm"></div>
      <div class="rodape-dialog">
        <button type="button" class="btn btn-claro" id="cancelar">Cancelar</button>
        <button type="submit" class="btn btn-azul" value="salvar">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let cartas = [];
    let adms = [];
    let mapa = {};
    $("avisoDemo").hidden = !DB.demo;

    // aceita "250.000,00", "250000", "250000.50"
    const num = (v) => {
      v = String(v || "").trim().replace(/[R$\s]/g, "");
      if (v.includes(",")) v = v.replace(/\./g, "").replace(",", ".");
      return Number(v) || 0;
    };

    async function mostrar() {
      const ok = await DB.logado();
      $("telaLogin").hidden = ok;
      $("telaPainel").hidden = !ok;
      $("sair").hidden = !ok;
      if (ok) carregar();
    }

    async function carregar() {
      try {
        [cartas, adms] = await Promise.all([DB.listar(), DB.listarAdms()]);
        mapa = mapaAdms(adms);
        render(); renderAdms();
      }
      catch (e) { alertaErro(e); }
    }

    function render() {
      const termo = $("busca").value.trim().toLowerCase();
      const st = $("fStatus").value;
      const lista = cartas
        .filter(c => !st || c.status === st)
        .filter(c => !termo || String(c.codigo).toLowerCase().includes(termo) || String(c.administradora).toLowerCase().includes(termo));
      $("vazio").hidden = lista.length > 0;
      $("tbody").innerHTML = lista.map(c => `
        <tr>
          <td class="forte">${esc(c.codigo)}</td>
          <td>${CATEGORIAS[c.categoria]}</td>
          <td class="num">${fmtBRL(c.credito)}</td>
          <td class="num">${fmtBRL(c.entrada)}</td>
          <td class="num">${esc(c.parcelas)}x ${fmtBRL(c.valor_parcela)}</td>
          <td>${admHTML(c.administradora, mapa)}</td>
          <td>
            <select data-status="${c.id}" class="badge ${c.status}" style="border:0;cursor:pointer">
              ${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === c.status ? "selected" : ""}>${v}</option>`).join("")}
            </select>
          </td>
          <td class="acoes">
            <button class="btn btn-claro" data-editar="${c.id}">Editar</button>
            <button class="btn btn-perigo" data-excluir="${c.id}">Excluir</button>
          </td>
        </tr>`).join("");
    }

    function abrir(c) {
      const f = $("formCarta");
      f.reset();
      $("erroForm").textContent = "";
      $("dlgTitulo").textContent = c ? `Editar carta ${c.codigo}` : "Nova carta";
      // monta a lista de administradoras (inclui a da carta, se não estiver cadastrada)
      const nomes = adms.map(a => a.nome);
      if (c && c.administradora && !nomes.includes(c.administradora)) nomes.push(c.administradora);
      $("selAdm").innerHTML = `<option value="" disabled selected>Selecione…</option>` +
        nomes.map(n => `<option>${esc(n)}</option>`).join("");
      if (c) for (const [k, v] of Object.entries(c)) if (f.elements[k]) f.elements[k].value = v ?? "";
      logoSelecionada();
      $("dlg").showModal();
    }

    function logoSelecionada() {
      const v = $("selAdm").value;
      $("selAdmLogo").innerHTML = v ? admHTML(v, mapa, { soLogo: true }) : "";
    }

    // ---------- Administradoras ----------
    function renderAdms() {
      $("gradeAdms").innerHTML = adms.map(a => {
        const usadas = cartas.filter(c => c.administradora === a.nome).length;
        return `
        <div class="item-adm">
          ${admHTML(a.nome, mapa, { soLogo: true })}
          <div class="nome">${esc(a.nome)}</div>
          <small style="color:var(--cinza)">${usadas} carta${usadas === 1 ? "" : "s"}</small>
          <div class="acoes">
            <button class="btn btn-claro" data-editar-adm="${a.id}">Editar</button>
            <button class="btn btn-perigo" data-excluir-adm="${a.id}">Excluir</button>
          </div>
        </div>`;
      }).join("") || `<div class="vazio">Nenhuma administradora cadastrada.</div>`;
    }

    let logoAtual = "";
    function limparFormAdm() {
      const f = $("formAdm");
      f.reset(); f.elements.id.value = ""; logoAtual = "";
      $("previewLogo").textContent = "sem logo";
      $("btnSalvarAdm").textContent = "Adicionar";
      $("cancelarAdm").hidden = true;
      $("erroAdm").textContent = "";
    }

    function alertaErro(e) { console.error(e); window.alert?.("Erro: " + (e.message || e)); }

    // Eventos
    $("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("erroLogin").textContent = "";
      try { await DB.login($("email").value, $("senha").value); mostrar(); }
      catch (err) { $("erroLogin").textContent = err.message; }
    });
    $("sair").addEventListener("click", async () => { await DB.logout(); mostrar(); });
    $("nova").addEventListener("click", () => abrir(null));
    $("cancelar").addEventListener("click", () => $("dlg").close());
    $("busca").addEventListener("input", render);
    $("selAdm").addEventListener("change", logoSelecionada);

    $("abasAdmin").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      document.querySelectorAll("#abasAdmin button").forEach(x => x.classList.toggle("ativo", x === b));
      $("abaCartas").hidden = b.dataset.aba !== "cartas";
      $("abaAdms").hidden = b.dataset.aba !== "adms";
    });

    $("formAdm").elements.logo.addEventListener("change", (e) => {
      const file = e.target.files[0];
      $("previewLogo").innerHTML = file ? `<img src="${URL.createObjectURL(file)}" alt="">` : (logoAtual ? `<img src="${esc(logoAtual)}" alt="">` : "sem logo");
    });
    $("cancelarAdm").addEventListener("click", limparFormAdm);

    $("formAdm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = e.target.elements;
      const btn = $("btnSalvarAdm");
      $("erroAdm").textContent = "";
      btn.disabled = true; btn.textContent = "Salvando…";
      try {
        const id = f.id.value ? Number(f.id.value) : null;
        const nome = f.nome.value.trim();
        const antigo = id ? adms.find(a => a.id === id) : null;
        let logo_url = logoAtual;
        if (f.logo.files[0]) logo_url = await DB.enviarLogo(f.logo.files[0]);
        await DB.salvarAdm({ ...(id ? { id } : {}), nome, logo_url });
        // se renomeou, atualiza as cartas que usavam o nome antigo
        if (antigo && antigo.nome !== nome) {
          for (const c of cartas.filter(c => c.administradora === antigo.nome)) await DB.salvar({ ...c, administradora: nome });
        }
        limparFormAdm();
        await carregar();
      } catch (err) {
        $("erroAdm").textContent = "Erro: " + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = $("formAdm").elements.id.value ? "Salvar" : "Adicionar";
      }
    });

    $("gradeAdms").addEventListener("click", async (e) => {
      const ed = e.target.dataset.editarAdm, ex = e.target.dataset.excluirAdm;
      if (ed) {
        const a = adms.find(a => a.id == ed);
        const f = $("formAdm");
        f.elements.id.value = a.id; f.elements.nome.value = a.nome; f.elements.logo.value = "";
        logoAtual = a.logo_url || "";
        $("previewLogo").innerHTML = logoAtual ? `<img src="${esc(logoAtual)}" alt="">` : "sem logo";
        $("btnSalvarAdm").textContent = "Salvar";
        $("cancelarAdm").hidden = false;
        f.scrollIntoView({ behavior: "smooth", block: "center" });
        f.elements.nome.focus();
      }
      if (ex) {
        const a = adms.find(a => a.id == ex);
        if (cartas.some(c => c.administradora === a.nome)) {
          $("erroAdm").textContent = `Não dá pra excluir "${a.nome}": ainda tem cartas usando essa administradora.`;
          return;
        }
        const b = e.target;
        if (b.dataset.confirmar !== "1") {
          b.dataset.confirmar = "1"; b.textContent = "Confirmar?";
          setTimeout(() => { b.dataset.confirmar = ""; b.textContent = "Excluir"; }, 3000);
          return;
        }
        try { await DB.excluirAdm(a.id); carregar(); } catch (err) { $("erroAdm").textContent = "Erro: " + err.message; }
      }
    });
    $("fStatus").addEventListener("change", render);

    $("formCarta").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = e.target.elements;
      const parcelas = parseInt(f.parcelas.value) || 0;
      const valor_parcela = num(f.valor_parcela.value);
      const carta = {
        codigo: f.codigo.value.trim(),
        cota: f.cota.value.trim(),
        categoria: f.categoria.value,
        status: f.status.value,
        credito: num(f.credito.value),
        entrada: num(f.entrada.value),
        parcelas,
        valor_parcela,
        saldo_devedor: f.saldo_devedor.value.trim() ? num(f.saldo_devedor.value) : +(parcelas * valor_parcela).toFixed(2),
        administradora: f.administradora.value.trim(),
        grupo: f.grupo.value.trim()
      };
      if (f.id.value) carta.id = Number(f.id.value);
      try { await DB.salvar(carta); $("dlg").close(); carregar(); }
      catch (err) { $("erroForm").textContent = "Erro ao salvar: " + err.message; }
    });

    $("tbody").addEventListener("click", async (e) => {
      const ed = e.target.dataset.editar, ex = e.target.dataset.excluir;
      if (ed) abrir(cartas.find(c => c.id == ed));
      if (ex) {
        // confirmação em 2 cliques (sem pop-up do navegador)
        const b = e.target;
        if (b.dataset.confirmar !== "1") {
          b.dataset.confirmar = "1"; b.textContent = "Confirmar?";
          setTimeout(() => { b.dataset.confirmar = ""; b.textContent = "Excluir"; }, 3000);
          return;
        }
        try { await DB.excluir(Number(ex)); carregar(); } catch (err) { alertaErro(err); }
      }
    });

    $("tbody").addEventListener("change", async (e) => {
      const id = e.target.dataset.status; if (!id) return;
      const c = cartas.find(c => c.id == id);
      try { await DB.salvar({ ...c, status: e.target.value }); carregar(); } catch (err) { alertaErro(err); }
    });

    mostrar();
  </script>
</body>
</html>
